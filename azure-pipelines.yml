trigger:
  branches: { include: [main] }
  paths: { exclude: [infrastructure/**, demo/**] }
pool: { vmImage: ubuntu-latest }
steps:
- task: NodeTool@0
  inputs: { versionSpec: '22.x' }
- script: npm ci
  displayName: Install locked dependencies
- script: |
    bash scripts/install-oscal-cli.sh
    npm run demo:prepare
    OSCAL_CLI="$PWD/work/oscal-cli/bin/oscal-cli" npm run content:build
    npm run check
  displayName: OSCAL, security tests and production build
- publish: dist
  artifact: application
