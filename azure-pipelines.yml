# Main merges and PRs verify only. Cloud deployment requires an explicit run selection.
trigger:
  batch: true
  branches: {include: [main]}
pr:
  branches: {include: [main]}
parameters:
- name: deploy
  type: boolean
  default: false
- name: serviceConnection
  type: string
  default: ''
- name: deploymentServiceConnection
  type: string
  default: ''
- name: devAgentPool
  type: string
  default: scribe-dev-agents
- name: deployApplication
  type: boolean
  default: true
- name: configFile
  type: string
  default: config/test.json
  values: [config/test.json, config/dev.json]
- name: environmentName
  type: string
  default: ''
- name: variableGroup
  type: string
  default: ''
variables:
- group: ${{ coalesce(parameters.variableGroup, iif(eq(parameters.configFile, 'config/dev.json'), 'oscal-scribe-dev', 'oscal-scribe-test')) }}
pool: {vmImage: ubuntu-24.04}
stages:
- stage: Build
  jobs:
  - job: Build
    steps:
    - checkout: self
    - template: pipelines/templates/tools.yml
      parameters: {build: true}
    - bash: |
        set -euo pipefail
        npm run demo:prepare
        OSCAL_CLI="$PWD/work/oscal-cli/bin/oscal-cli" npm run content:build
        npm run check
        npm audit --audit-level=moderate
        bash scripts/ci/security-scan.sh
        terraform -chdir=infrastructure init -backend=false -lockfile=readonly
        terraform -chdir=infrastructure validate
        terraform -chdir=infrastructure fmt -check -recursive
        terraform -chdir=infrastructure test -var-file=../work/security-dev.tfvars.json
        node scripts/ci/package.mjs
      displayName: Test and package the application
    - publish: work/application
      artifact: application
- ${{ if eq(parameters.deploy, true) }}:
  - stage: Plan
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
    - job: Plan
      steps:
      - checkout: self
      - template: pipelines/templates/tools.yml
      - template: pipelines/templates/azure-step.yml
        parameters:
          serviceConnection: ${{ parameters.serviceConnection }}
          configFile: ${{ parameters.configFile }}
          name: TerraformPlan
          displayName: Plan infrastructure using central state
          script: |
            node scripts/ci/terraform.mjs --allow-new
            set +e
            terraform -chdir=infrastructure plan -input=false -detailed-exitcode -lock-timeout=5m -var-file=../work/ci/deployment.tfvars.json -out=../work/ci/deployment.tfplan
            result=$?
            set -e
            if [ "$result" = 1 ]; then exit 1; fi
            if [ "$result" = 2 ]; then
              echo '##vso[task.setvariable variable=hasChanges;isOutput=true]true'
            elif [ "$result" = 0 ]; then
              echo '##vso[task.setvariable variable=hasChanges;isOutput=true]false'
            else
              exit "$result"
            fi
      - publish: work/ci/deployment.tfplan
        artifact: infrastructure-plan
  - stage: Review
    dependsOn: Plan
    condition: and(succeeded(), or(eq(dependencies.Plan.outputs['Plan.TerraformPlan.hasChanges'], 'true'), eq('${{ parameters.configFile }}', 'config/dev.json')))
    jobs:
    - job: Review
      pool: server
      timeoutInMinutes: 1440
      steps:
      - task: ManualValidation@1
        timeoutInMinutes: 720
        inputs:
          notifyUsers: ''
          allowApproversToApproveTheirOwnRuns: ${{ eq(parameters.configFile, 'config/test.json') }}
          instructions: Review the Terraform plan in the Plan job. Approve only the intended environment and changes. This will deploy infrastructure and the tested application artifact. Demo data is separate.
          onTimeout: reject
  - stage: Deploy
    dependsOn: [Plan, Review]
    condition: and(not(canceled()), in(dependencies.Plan.result, 'Succeeded', 'SucceededWithIssues'), in(dependencies.Review.result, 'Succeeded', 'Skipped'))
    lockBehavior: sequential
    jobs:
    - deployment: Deploy
      environment: ${{ coalesce(parameters.environmentName, iif(eq(parameters.configFile, 'config/dev.json'), 'scribe-dev', 'scribe-test')) }}
      timeoutInMinutes: 60
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: self
            - download: current
              artifact: application
            - download: current
              artifact: infrastructure-plan
            - template: pipelines/templates/tools.yml
            - template: pipelines/templates/azure-step.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                configFile: ${{ parameters.configFile }}
                name: InfrastructureApply
                displayName: Apply the reviewed infrastructure plan
                script: |
                  node scripts/ci/terraform.mjs --allow-new
                  node scripts/ci/assert-plan.mjs "$(Pipeline.Workspace)/infrastructure-plan/deployment.tfplan"
                  terraform -chdir=infrastructure apply -input=false -lock-timeout=5m "$(Pipeline.Workspace)/infrastructure-plan/deployment.tfplan"
                  terraform -chdir=infrastructure output -json > work/ci/outputs.json
                  node scripts/ci/seal-outputs.mjs
            - publish: work/ci/deployment.json
              artifact: deployment-target
    - ${{ if eq(parameters.deployApplication, true) }}:
      - deployment: Application
        dependsOn: Deploy
        environment: ${{ coalesce(parameters.environmentName, iif(eq(parameters.configFile, 'config/dev.json'), 'scribe-dev', 'scribe-test')) }}
        pool:
          ${{ if eq(parameters.configFile, 'config/dev.json') }}:
            name: ${{ parameters.devAgentPool }}
          ${{ else }}:
            vmImage: ubuntu-24.04
        strategy:
          runOnce:
            deploy:
              steps:
              - checkout: self
              - download: current
                artifact: application
              - download: current
                artifact: deployment-target
              - task: NodeTool@0
                inputs: {versionSpec: '22.x'}
              - script: npm ci --ignore-scripts
                displayName: Restore locked deployment tooling
              - template: pipelines/templates/azure-step.yml
                parameters:
                  serviceConnection: ${{ parameters.deploymentServiceConnection }}
                  role: deployment
                  configFile: ${{ parameters.configFile }}
                  name: ApplicationDeploy
                  displayName: Deploy the tested application artifact
                  script: node scripts/deploy-app.mjs "$(Pipeline.Workspace)/application" "$(Pipeline.Workspace)/deployment-target/deployment.json"
              - task: AzureStaticWebApp@0
                displayName: Deploy the verified static web artifact
                inputs:
                  azure_static_web_apps_api_token: $(ScribeSwaDeploymentToken)
                  app_location: work/deploy-web
                  output_location: ''
                  skip_app_build: true
                  skip_api_build: true
              - script: node scripts/smoke.mjs
                displayName: Verify deployed authentication boundary
                env:
                  SCRIBE_URL: $(ScribeWebUrl)
