# Explicitly optional. Never invoked by normal application/infrastructure deployment.
trigger: none
pr: none
parameters:
- name: serviceConnection
  type: string
  default: ''
- name: configFile
  type: string
  default: config/test.json
  values: [config/test.json, config/dev.json]
- name: variableGroup
  type: string
  default: ''
variables:
- group: ${{ coalesce(parameters.variableGroup, iif(eq(parameters.configFile, 'config/dev.json'), 'oscal-scribe-dev', 'oscal-scribe-test')) }}
pool: {vmImage: ubuntu-24.04}
steps:
- checkout: self
- template: templates/tools.yml
  parameters: {build: true}
- bash: |
    set -euo pipefail
    npm run demo:prepare
    OSCAL_CLI="$PWD/work/oscal-cli/bin/oscal-cli" npm run content:build
  displayName: Build the separate seven-control SOC demo release
- publish: work/content-release.json
  artifact: demo-release
- template: templates/azure-step.yml
  parameters:
    serviceConnection: ${{ parameters.serviceConnection }}
    role: publisher
    configFile: ${{ parameters.configFile }}
    displayName: Publish demo content to the selected test environment
    script: |
      node --input-type=module -e "import{loadConfig}from'./scripts/ci/config.mjs';if(!loadConfig().allow_demo)throw Error('Demo publication is disabled in this environment')"
      COSMOS_ENDPOINT=$(node scripts/ci/publisher-target.mjs)
      export COSMOS_ENDPOINT
      export ALLOW_DEMO_PUBLICATION=true
      npm run content:publish
