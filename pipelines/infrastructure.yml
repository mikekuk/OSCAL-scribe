# Configure a workload-identity-federated Azure Resource Manager service connection.
# Keep apply in an Azure DevOps Environment with an approval check.
trigger: none
parameters:
- name: serviceConnection
  type: string
- name: environment
  type: string
  default: scribe-test
pool: { vmImage: ubuntu-latest }
stages:
- stage: Plan
  jobs:
  - job: TerraformPlan
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: ${{ parameters.serviceConnection }}
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          cp infrastructure/backend.tf.example infrastructure/backend.tf
          terraform -chdir=infrastructure init -backend-config="resource_group_name=$(stateResourceGroup)" -backend-config="storage_account_name=$(stateStorageAccount)" -backend-config="container_name=tfstate" -backend-config="key=scribe.tfstate" -backend-config="use_azuread_auth=true"
          terraform -chdir=infrastructure validate
          terraform -chdir=infrastructure plan -out=deployment.tfplan
      env:
        TF_VAR_subscription_id: $(subscriptionId)
        TF_VAR_tenant_id: $(tenantId)
        TF_VAR_publisher_object_id: $(publisherObjectId)
    - publish: infrastructure/deployment.tfplan
      artifact: infrastructure-plan
- stage: Apply
  dependsOn: Plan
  jobs:
  - deployment: Infrastructure
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - download: current
            artifact: infrastructure-plan
          - task: AzureCLI@2
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                cp infrastructure/backend.tf.example infrastructure/backend.tf
                terraform -chdir=infrastructure init -backend-config="resource_group_name=$(stateResourceGroup)" -backend-config="storage_account_name=$(stateStorageAccount)" -backend-config="container_name=tfstate" -backend-config="key=scribe.tfstate" -backend-config="use_azuread_auth=true"
                terraform -chdir=infrastructure apply "$(Pipeline.Workspace)/infrastructure-plan/deployment.tfplan"
