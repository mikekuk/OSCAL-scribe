# Creates only the central backend, in resource groups provisioned by an administrator.
trigger: none
pr: none
parameters:
- name: configFile
  displayName: Environment configuration
  type: string
  default: config/test.json
  values: [config/test.json, config/dev.json]
- name: variableGroup
  displayName: Protected variable group override (leave blank for profile default)
  type: string
  default: ''
- name: serviceConnection
  displayName: Infrastructure connection override (leave blank for profile default)
  type: string
  default: ''
variables:
- template: templates/profile.yml
  parameters:
    configFile: ${{ parameters.configFile }}
    variableGroup: ${{ parameters.variableGroup }}
pool: {vmImage: ubuntu-24.04}
steps:
- checkout: self
- task: NodeTool@0
  inputs: {versionSpec: '22.x'}
- template: templates/azure-step.yml
  parameters:
    serviceConnection: ${{ parameters.serviceConnection }}
    configFile: ${{ parameters.configFile }}
    displayName: Create protected central Terraform backend
    script: node scripts/ci/bootstrap.mjs
