# Creates only the central backend, in resource groups provisioned by an administrator.
trigger: none
pr: none
parameters:
- name: serviceConnection
  type: string
  default: ''
- name: configFile
  type: string
  default: config/test.json
  values: [config/test.json, config/dev.json]
- name: variableGroup
  type: string
  default: ''
variables:
- group: ${{ coalesce(parameters.variableGroup, iif(eq(parameters.configFile, 'config/dev.json'), 'oscal-scribe-dev', 'oscal-scribe-test')) }}
pool: {vmImage: ubuntu-24.04}
steps:
- checkout: self
- task: NodeTool@0
  inputs: {versionSpec: '22.x'}
- template: templates/azure-step.yml
  parameters:
    serviceConnection: ${{ parameters.serviceConnection }}
    configFile: ${{ parameters.configFile }}
    displayName: Create protected central Terraform backend
    script: node scripts/ci/bootstrap.mjs
