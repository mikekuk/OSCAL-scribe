trigger: none
pr: none
parameters:
- name: action
  type: string
  default: stop
  values: [stop, start, destroy]
- name: serviceConnection
  type: string
  default: ''
- name: configFile
  type: string
  default: config/test.json
  values: [config/test.json, config/dev.json]
- name: environmentName
  type: string
  default: ''
- name: variableGroup
  type: string
  default: ''
variables:
- group: ${{ coalesce(parameters.variableGroup, iif(eq(parameters.configFile, 'config/dev.json'), 'oscal-scribe-dev', 'oscal-scribe-test')) }}
pool: {vmImage: ubuntu-24.04}
stages:
- ${{ if ne(parameters.action, 'destroy') }}:
  - stage: Operate
    lockBehavior: sequential
    jobs:
    - deployment: Operate
      environment: ${{ coalesce(parameters.environmentName, iif(eq(parameters.configFile, 'config/dev.json'), 'scribe-dev', 'scribe-test')) }}
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: self
            - template: templates/tools.yml
            - template: templates/azure-step.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                configFile: ${{ parameters.configFile }}
                displayName: ${{ parameters.action }} Function App
                script: |
                  node scripts/ci/terraform.mjs
                  az functionapp ${{ parameters.action }} --resource-group "$(terraform -chdir=infrastructure output -raw resource_group)" --name "$(terraform -chdir=infrastructure output -raw function_name)" --output none
- ${{ if eq(parameters.action, 'destroy') }}:
  - stage: PlanDestroy
    jobs:
    - job: PlanDestroy
      steps:
      - checkout: self
      - template: templates/tools.yml
      - template: templates/azure-step.yml
        parameters:
          serviceConnection: ${{ parameters.serviceConnection }}
          configFile: ${{ parameters.configFile }}
          displayName: Plan destruction of application and Entra objects
          script: |
            node scripts/ci/terraform.mjs
            node scripts/ci/guard-destroy.mjs
            terraform -chdir=infrastructure plan -destroy -parallelism=1 -input=false -lock-timeout=5m -var-file=../work/ci/deployment.tfvars.json -out=../work/ci/destroy.tfplan
      - publish: work/ci/destroy.tfplan
        artifact: destroy-plan
  - stage: ConfirmDestroy
    dependsOn: PlanDestroy
    jobs:
    - job: ConfirmDestroy
      pool: server
      timeoutInMinutes: 1440
      steps:
      - task: ManualValidation@1
        timeoutInMinutes: 720
        inputs:
          notifyUsers: ''
          allowApproversToApproveTheirOwnRuns: ${{ eq(parameters.configFile, 'config/test.json') }}
          instructions: DESTRUCTIVE. Review the plan and backups. Approval deletes Scribe resources, SSPs, published content and its Entra application. The state backend and administrator-created resource groups remain.
          onTimeout: reject
  - stage: Destroy
    lockBehavior: sequential
    dependsOn: ConfirmDestroy
    jobs:
    - deployment: Destroy
      environment: ${{ coalesce(parameters.environmentName, iif(eq(parameters.configFile, 'config/dev.json'), 'scribe-dev', 'scribe-test')) }}
      timeoutInMinutes: 60
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: self
            - download: current
              artifact: destroy-plan
            - template: templates/tools.yml
            - template: templates/azure-step.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                configFile: ${{ parameters.configFile }}
                displayName: Apply reviewed destruction plan
                script: |
                  node scripts/ci/terraform.mjs
                  node scripts/ci/guard-destroy.mjs
                  node scripts/ci/assert-plan.mjs "$(Pipeline.Workspace)/destroy-plan/destroy.tfplan"
                  terraform -chdir=infrastructure apply -parallelism=1 -input=false -lock-timeout=5m "$(Pipeline.Workspace)/destroy-plan/destroy.tfplan"
