trigger: none
parameters:
- name: serviceConnection
  type: string
- name: environment
  type: string
  default: scribe-test
pool: { vmImage: ubuntu-latest }
jobs:
- deployment: Application
  environment: ${{ parameters.environment }}
  strategy:
    runOnce:
      deploy:
        steps:
        - checkout: self
        - task: NodeTool@0
          inputs: { versionSpec: '22.x' }
        - task: AzureCLI@2
          inputs:
            azureSubscription: ${{ parameters.serviceConnection }}
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              npm ci
              bash scripts/install-oscal-cli.sh
              npm run demo:prepare
              OSCAL_CLI="$PWD/work/oscal-cli/bin/oscal-cli" npm run content:build
              npm run check
              cp infrastructure/backend.tf.example infrastructure/backend.tf
              terraform -chdir=infrastructure init -backend-config="resource_group_name=$(stateResourceGroup)" -backend-config="storage_account_name=$(stateStorageAccount)" -backend-config="container_name=tfstate" -backend-config="key=scribe.tfstate" -backend-config="use_azuread_auth=true"
              node scripts/deploy-app.mjs
              SCRIBE_URL=$(terraform -chdir=infrastructure output -raw web_url) node scripts/smoke.mjs
