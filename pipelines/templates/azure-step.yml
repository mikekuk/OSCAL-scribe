parameters:
- name: serviceConnection
  type: string
- name: role
  type: string
  default: infrastructure
  values: [infrastructure, deployment, publisher]
- name: configFile
  type: string
- name: script
  type: string
- name: displayName
  type: string
- name: name
  type: string
  default: Azure
- name: workingDirectory
  type: string
  default: $(Build.SourcesDirectory)
steps:
- task: AzureCLI@2
  name: ${{ parameters.name }}
  displayName: ${{ parameters.displayName }}
  inputs:
    workingDirectory: ${{ parameters.workingDirectory }}
    azureSubscription: ${{ coalesce(parameters.serviceConnection, iif(eq(parameters.configFile, 'config/dev.json'), format('oscal-scribe-dev-{0}', parameters.role), 'oscal-scribe-azure')) }}
    scriptType: bash
    scriptLocation: inlineScript
    addSpnToEnvironment: true
    visibleAzLogin: false
    inlineScript: |
      set -euo pipefail
      source scripts/ci/identity.sh
      node scripts/ci/preflight.mjs ${{ parameters.role }}
      ${{ parameters.script }}
  env:
    SCRIBE_ENVIRONMENT_JSON: $(scribeEnvironment)
    SCRIBE_CONFIG: ${{ parameters.configFile }}
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
