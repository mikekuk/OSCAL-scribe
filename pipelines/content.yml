trigger: none
pr: none
parameters:
- name: configFile
  displayName: Environment configuration
  type: string
  default: config/test.json
  values: [config/test.json, config/dev.json]
- name: contentSource
  displayName: Content source
  type: string
  default: nist-reference
  values: [nist-reference, controlled-repository]
- name: contentRepository
  displayName: Controlled repository (used only for controlled-repository)
  type: string
  default: ControlledOSCAL
- name: contentRef
  displayName: Controlled repository branch or tag
  type: string
  default: refs/heads/main
- name: variableGroup
  displayName: Protected variable group override (leave blank for profile default)
  type: string
  default: ''
- name: serviceConnection
  displayName: Publisher connection override (leave blank for profile default)
  type: string
  default: ''
- name: devAgentPool
  displayName: Private agent pool override (leave blank for profile default)
  type: string
  default: ''
resources:
  repositories:
  - ${{ if eq(parameters.contentSource, 'controlled-repository') }}:
    - repository: controlled
      type: git
      name: ${{ parameters.contentRepository }}
      ref: ${{ parameters.contentRef }}
variables:
- template: templates/profile.yml
  parameters:
    configFile: ${{ parameters.configFile }}
    variableGroup: ${{ parameters.variableGroup }}
pool:
  ${{ if eq(parameters.configFile, 'config/dev.json') }}:
    name: ${{ coalesce(parameters.devAgentPool, variables.scribeDataAgentPool) }}
  ${{ else }}:
    vmImage: ubuntu-24.04
steps:
- checkout: self
  path: s/scribe
- ${{ if eq(parameters.contentSource, 'controlled-repository') }}:
  - checkout: controlled
    path: s/controlled
- task: NodeTool@0
  inputs: {versionSpec: '22.x'}
- task: JavaToolInstaller@0
  inputs:
    versionSpec: '21'
    jdkArchitectureOption: x64
    jdkSourceOption: PreInstalled
- bash: |
    set -euo pipefail
    npm ci
    bash scripts/install-oscal-cli.sh
    if [ "$CONTENT_SOURCE" = nist-reference ]; then
      node --import tsx scripts/prepare-reference.ts
      npm run content:build -- work/reference-source
      git rev-parse HEAD > work/content-source-commit.txt
    else
      npm run content:build -- ../controlled
      git -C ../controlled rev-parse HEAD > work/content-source-commit.txt
    fi
  workingDirectory: $(Pipeline.Workspace)/s/scribe
  displayName: Validate and resolve controlled content
  env:
    CONTENT_SOURCE: ${{ parameters.contentSource }}
- publish: $(Pipeline.Workspace)/s/scribe/work/content-release.json
  artifact: approved-content-release
- publish: $(Pipeline.Workspace)/s/scribe/work/content-source-commit.txt
  artifact: content-provenance
- template: templates/azure-step.yml
  parameters:
    serviceConnection: ${{ parameters.serviceConnection }}
    role: publisher
    configFile: ${{ parameters.configFile }}
    workingDirectory: $(Pipeline.Workspace)/s/scribe
    displayName: Publish approved controlled content
    script: |
      COSMOS_ENDPOINT=$(node scripts/ci/publisher-target.mjs)
      export COSMOS_ENDPOINT
      npm run content:publish
