name: Build and security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.11.4
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: bash scripts/ci/security-scan.sh
      - run: bash scripts/install-oscal-cli.sh
      - run: npm run demo:prepare
      - run: npm run content:build
        env:
          OSCAL_CLI: ${{ github.workspace }}/work/oscal-cli/bin/oscal-cli
      - run: npm run check
      - run: node scripts/ci/package.mjs
      - run: terraform -chdir=infrastructure fmt -check -recursive
      - run: terraform -chdir=infrastructure init -backend=false -lockfile=readonly
      - run: terraform -chdir=infrastructure validate
      - run: terraform -chdir=infrastructure test -var-file=../work/security-dev.tfvars.json
